services:
    vprodb:
      build: 
        context: ./Docker-files/db
      image: kenechukwu007/vprofiledb
      container_name: vprodb
      ports:
        - "3306:3306"
      volumes:
        - vprodb_data:/var/lib/mysql
      environment:
        - MYSQL_ROOT_PASSWORD=vprodbpass
        - MYSQL_DATABASE=accounts

    vprocache01:
      image: memcached
      container_name: vprocache01
      ports:
        - "11211:11211"

    vpromq01:
      image: rabbitmq
      container_name: vpromq01
      ports:
        - "5672:5672"
      environment:
        - RABBITMQ_DEFAULT_USER=guest
        - RABBITMQ_DEFAULT_PASS=guest

    vproapp:
      build: 
        context: ./Docker-files/app
      image: kenechukwu007/vprofileapp
      container_name: vproapp
      ports:
        - "8080:8080"
      volumes:
        - vproapp_data:/var/local/tomcat/webapps


    vproweb:
      build: 
        context: ./Docker-files/web
      image: kenechukwu007/vprofileweb
      container_name: vproweb
      ports:
        - "80:80"
volumes:
    vprodb_data: {}
    vproapp_data: {}
